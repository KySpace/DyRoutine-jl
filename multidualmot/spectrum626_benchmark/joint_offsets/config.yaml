# Calibration-only variant for benchmark_spectral626.jl.
benchmark:
  name: 'Joint with offsets'
  path_data: 'C:\Users\ky\OneDrive\Dy\DualIstpMOT\Data\spectrum 626'
  frequency_range_mhz: [-750, 750]
  range_reference_index: 1
  plot_samples: 2001
calibration:
  - tag: common
    model: spline_with_offset_and_error
    fit_source_offsets: true
    knots: [-1.5, -1, -0.5, 0, 1, 2]
    regularisation: 0.002 # λ, coefficient of the second-derivative-square-integrgral
    source:
    - index: 1
      descr: "Peak MZM off, EOM 740MHz 2dBm"
      peaks:
        - { freq: +740  , time: -1.368 }
        - { freq: +441.6, time: -0.444 }
        - { freq: +220.8, time:  0.096 }
        - { freq: 0     , time:  0.569 }
        - { freq: -740  , time:  1.963 }
    - index: 2
      descr: "Peak MZM off, EOM off"
      peaks:
